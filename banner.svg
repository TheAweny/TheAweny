<line x1="170" y1="194" x2="170" y2="202" stroke="#8b0000" stroke-width="0.8" opacity="0.5"/>
<line x1="190" y1="194" x2="190" y2="202" stroke="#8b0000" stroke-width="0.8" opacity="0.5"/>
<line x1="210" y1="194" x2="210" y2="202" stroke="#8b0000" stroke-width="0.8" opacity="0.5"/>
<line x1="230" y1="194" x2="230" y2="202" stroke="#8b0000" stroke-width="0.8" opacity="0.5"/>
<line x1="250" y1="194" x2="250" y2="202" stroke="#8b0000" stroke-width="0.8" opacity="0.5"/>
<line x1="270" y1="194" x2="270" y2="202" stroke="#8b0000" stroke-width="0.8" opacity="0.5"/>

<!-- kissaki (blade tip) point -->
<polygon points="830,194 830,202 850,198" fill="#f5f5f5" opacity="0.7"/>

<!-- ── TITLE: TheAweny ── -->
<!-- glow/halo layer -->
<text x="450" y="112"
  text-anchor="middle"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="74" font-weight="700"
  fill="#c0392b" opacity="0.55"
  filter="url(#f-glow-lg)">TheAweny
  <animate attributeName="opacity" values="0.45;0.7;0.45" dur="3s" repeatCount="indefinite"/>
</text>
<!-- crisp top layer -->
<text x="450" y="112"
  text-anchor="middle"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="74" font-weight="700"
  fill="#e74c3c">TheAweny
  <animate attributeName="fill" values="#e74c3c;#ff6b6b;#e74c3c" dur="3s" repeatCount="indefinite"/>
</text>

<!-- ── SUBTITLE ── -->
<text x="450" y="148"
  text-anchor="middle"
  font-family="'Courier New', Courier, monospace"
  font-size="13" font-weight="400"
  fill="#777777" letter-spacing="6">FULL-STACK DEVELOPER
</text>

<!-- subtitle underline -->
<line x1="310" y1="155" x2="590" y2="155" stroke="#8b0000" stroke-width="0.6" opacity="0.5"/>
<circle cx="310" cy="155" r="2" fill="#c0392b" opacity="0.6"/>
<circle cx="590" cy="155" r="2" fill="#c0392b" opacity="0.6"/>

