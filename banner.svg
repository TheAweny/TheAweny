<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#020202"/>
    <stop offset="35%"  stop-color="#110101"/>
    <stop offset="65%"  stop-color="#110101"/>
    <stop offset="100%" stop-color="#020202"/>
  </linearGradient>
  <linearGradient id="vglow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#8b0000" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#8b0000" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#8b0000" stop-opacity="0"/>
    <stop offset="18%"  stop-color="#c0392b"/>
    <stop offset="52%"  stop-color="#f5f5f5"/>
    <stop offset="78%"  stop-color="#c0392b"/>
    <stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="blade-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#5a0000" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#8b0000"/>
    <stop offset="55%"  stop-color="#c0392b"/>
    <stop offset="80%"  stop-color="#8b0000"/>
    <stop offset="100%" stop-color="#5a0000" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="moon-fill" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#4a0000"/>
    <stop offset="70%"  stop-color="#2a0000"/>
    <stop offset="100%" stop-color="#150000"/>
  </radialGradient>
  <filter id="f-glow-lg" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="f-glow-sm" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="f-moon" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="f-blade" x="-10%" y="-200%" width="120%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- ── BG ── -->
<rect width="900" height="280" fill="url(#bg)"/>
<rect width="900" height="280" fill="url(#vglow)"/>

<!-- subtle horizontal scan lines -->
<line x1="0" y1="60"  x2="900" y2="60"  stroke="#8b0000" stroke-width="0.25" opacity="0.18"/>
<line x1="0" y1="140" x2="900" y2="140" stroke="#8b0000" stroke-width="0.4"  opacity="0.12"/>
<line x1="0" y1="220" x2="900" y2="220" stroke="#8b0000" stroke-width="0.25" opacity="0.18"/>
<line x1="0" y1="100" x2="900" y2="100" stroke="#8b0000" stroke-width="0.15" opacity="0.1"/>
<line x1="0" y1="180" x2="900" y2="180" stroke="#8b0000" stroke-width="0.15" opacity="0.1"/>

<!-- ── BLOOD MOON ── -->
<circle cx="748" cy="72" r="90" fill="url(#moon-fill)" filter="url(#f-moon)" opacity="0.85">
  <animate attributeName="opacity" values="0.7;0.95;0.7" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="748" cy="72" r="88" fill="none" stroke="#8b0000" stroke-width="1.5" opacity="0.35">
  <animate attributeName="opacity" values="0.25;0.5;0.25" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="748" cy="72" r="78" fill="none" stroke="#c0392b" stroke-width="0.5" opacity="0.2"/>
<!-- moon crater details -->
<circle cx="730" cy="55" r="8"  fill="none" stroke="#5a0000" stroke-width="0.5" opacity="0.4"/>
<circle cx="762" cy="88" r="5"  fill="none" stroke="#5a0000" stroke-width="0.5" opacity="0.3"/>
<circle cx="745" cy="40" r="3"  fill="none" stroke="#5a0000" stroke-width="0.4" opacity="0.3"/>

<!-- ── KATANA ── -->
<!-- blade glow layer -->
<rect x="70" y="195" width="760" height="6" rx="3" fill="url(#blade)" filter="url(#f-blade)" opacity="0.6">
  <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
</rect>
<!-- blade edge -->
<rect x="70" y="197" width="760" height="2" rx="1" fill="url(#blade-edge)">
  <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
</rect>
<!-- blade highlight (white edge) -->
<rect x="70" y="197.5" width="760" height="0.8" rx="0.4" fill="#ffffff" opacity="0.15"/>

<!-- tsuba (guard) at x=290 -->
<ellipse cx="292" cy="198" rx="15" ry="25" fill="#600000" opacity="0.95"/>
<ellipse cx="292" cy="198" rx="10" ry="17" fill="#8b0000"/>
<ellipse cx="292" cy="198" rx="5"  ry="9"  fill="#c0392b" opacity="0.9"/>
<ellipse cx="292" cy="198" rx="2"  ry="4"  fill="#e74c3c"/>
<!-- tsuba ring detail -->
<ellipse cx="292" cy="198" rx="13" ry="23" fill="none" stroke="#c0392b" stroke-width="0.5" opacity="0.4"/>

<!-- habaki (collar) just before tsuba -->
<rect x="278" y="192" width="8" height="12" rx="2" fill="#7a0000" opacity="0.8"/>

<!-- handle wrapping (handle at left side) -->
<rect x="70"  y="194" width="210" height="8" rx="4" fill="#2a0000" opacity="0.9"/>
<line x1="90"  y1="194" x2="90"  y2="202" stroke="#8b0000" stroke-width="0.8" opacity="0.5"/>
<line x1="110" y1="194" x2="110" y2="202" stroke="#8b0000" stroke-width="0.8" opacity="0.5"/>
<line x1="130" y1="194" x2="130" y2="202" stroke="#8b0000" stroke-width="0.8" opacity="0.5"/>
